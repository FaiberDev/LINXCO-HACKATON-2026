services:
  backend:
    build:
      context: ./LINXCO-HACKATON
      dockerfile: Dockerfile
    container_name: linxco-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - path: ./LINXCO-HACKATON/.env
        required: false
      - path: .env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - wsp_session:/app/auth_info_baileys
      - generated_docs:/app/documentos_generados

  frontend:
    build:
      context: ./LINXCO-HACKATON-FRONTEND
      dockerfile: Dockerfile
    container_name: linxco-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  wsp_session:
  generated_docs:
